<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1b2a" />
    <title>Rock Skipping — Controller</title>
    <style>
      :root {
        --bg: #0d1b2a;
        --surface: #1b263b;
        --accent: #4cc9f0;
        --good: #57cc99;
        --bad: #ef476f;
        --text: #e0e1dd;
        --muted: #7d8597;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        touch-action: manipulation;
        user-select: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }

      /* Sizes raised for a phone held at arm's length (#50, phone audit finding 7). */
      #status {
        padding: 8px 12px;
        font-size: 14px;
        text-align: center;
        color: var(--muted);
        background: rgba(0, 0, 0, 0.25);
        flex: 0 0 auto;
      }
      #status.ok {
        color: var(--good);
      }
      #status.bad {
        color: var(--bad);
      }

      .screen {
        display: none;
        flex: 1 1 auto;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        gap: 14px;
      }
      .screen.active {
        display: flex;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 30px;
        letter-spacing: 2px;
        text-align: center;
      }
      h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        text-align: center;
      }
      p {
        margin: 0;
        color: var(--muted);
        text-align: center;
        font-size: 17px;
        line-height: 1.5;
      }

      input {
        width: 100%;
        max-width: 320px;
        padding: 16px;
        border-radius: 12px;
        border: 2px solid #2f3e56;
        background: var(--surface);
        color: var(--text);
        font-size: 20px;
        text-align: center;
        text-transform: uppercase;
      }
      input:focus {
        border-color: var(--accent);
        outline: none;
      }

      button {
        padding: 16px 36px;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #06263a;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
      }

      /* A secondary action, not a stone or the primary CTA — flat and quiet so
       CONFIRM stays the one thing on this screen that looks pressable at a glance. */
      button.link {
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
        box-shadow: none;
        text-decoration: underline;
      }

      /* A stone, not a button. Irregular radii give it a worn, asymmetric outline, and
       the off-centre highlight reads as a lit surface rather than flat fill. */
      #gripBtn {
        width: min(70vw, 260px);
        aspect-ratio: 1;
        border-radius: 54% 46% 49% 51% / 47% 52% 48% 53%;
        background: radial-gradient(
          ellipse 60% 50% at 34% 28%,
          #9aa7b4 0%,
          #6f7d8c 42%,
          #4d5967 100%
        );
        color: #f2f5f8;
        font-size: 24px;
        letter-spacing: 1px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        box-shadow:
          0 10px 0 #2b333d,
          inset 0 2px 6px rgba(255, 255, 255, 0.18);
        transition:
          transform 80ms,
          box-shadow 80ms,
          filter 80ms;
        touch-action: none;
      }

      /* Armed. Shifts tone and depth rather than swapping colour outright: this is the
       only feedback that the phone is listening, so it has to read at a glance while
       still looking like the same stone. */
      #gripBtn.held {
        transform: translateY(8px);
        filter: brightness(1.14);
        box-shadow:
          0 2px 0 #2b333d,
          inset 0 2px 8px rgba(255, 255, 255, 0.28),
          0 0 0 3px var(--good);
      }

      /* D3: Settling/Aiming status badge. Muted at rest, the same accent-vs-good
       distinction the grip button's own .held state uses, so a locked aim reads
       consistently across both elements. */
      .cal-badge {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--muted);
        transition:
          color 150ms,
          background 150ms;
      }
      .cal-badge.aiming {
        color: #06263a;
        background: var(--good);
      }

      /* D2: on-phone live tilt indicator. Runs continuously while #throwScreen is
       active; only the bubble's colour and the lock ring change on the
       Settling→Aiming edge. */
      .tilt-box {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: var(--surface);
        border: 2px solid #2f3e56;
        position: relative;
        overflow: hidden;
        flex: 0 0 auto;
      }
      .tilt-crosshair {
        position: absolute;
        inset: 0;
      }
      .tilt-crosshair::before,
      .tilt-crosshair::after {
        content: '';
        position: absolute;
        background: #2f3e56;
      }
      .tilt-crosshair::before {
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
      }
      .tilt-crosshair::after {
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
      }
      .tilt-bubble {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        transition: background 150ms;
      }
      .tilt-bubble.locked {
        background: var(--good);
      }
      /* D2's own lock pulse — a burst-and-fade at the instant of the lock. A
       different shape of animation from #armRing's progressive fill below, even
       though both are rings, because they mark two different kinds of event: this
       one an instant, that one a duration. */
      .tilt-lock-ring {
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        border: 2px solid var(--good);
        opacity: 0;
        pointer-events: none;
      }
      .tilt-lock-ring.show {
        animation: tiltLockPulse 500ms ease-out;
      }
      @keyframes tiltLockPulse {
        0% {
          opacity: 0.9;
          transform: scale(0.7);
        }
        100% {
          opacity: 0;
          transform: scale(1.15);
        }
      }

      /* D7: visible steady-hold gate. #armRing wraps the grip button; the circle
       fills clockwise over ThrowTuning.armGraceMs, its animationDuration set inline
       from that same constant (see renderArmRing in app.js) so the visual and the
       real grace window can never drift apart as two separate magic numbers. */
      .grip-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .arm-ring {
        position: absolute;
        inset: -10px;
        opacity: 0;
        pointer-events: none;
      }
      .arm-ring circle {
        fill: none;
        stroke: var(--good);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 289;
        stroke-dashoffset: 289;
        transform-origin: 50% 50%;
        transform: rotate(-90deg);
      }
      .arm-ring.filling {
        opacity: 1;
      }
      /* animation-duration is set inline from ThrowTuning.armGraceMs (renderArmRing
       in app.js), directly on this element rather than on the wrapper. */
      .arm-ring.filling circle {
        animation: armRingFillCircle linear forwards;
      }
      @keyframes armRingFillCircle {
        from {
          stroke-dashoffset: 289;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      /* Explicit and !important because `hidden` is only a UA rule of `display: none`,
       which any later display declaration on a button quietly beats. The advance
       buttons are hidden most of the time, so this has to be the rule that wins. */
      [hidden] {
        display: none !important;
      }

      .error {
        color: var(--bad);
        font-weight: 600;
        min-height: 20px;
        text-align: center;
      }

      /* The throw that just finished. Empty most of the time, so it collapses rather
       than leaving a gap above the scores. */
      .last-throw {
        color: var(--accent);
        font-weight: 600;
        margin: 0;
        min-height: 0;
      }
      .last-throw:empty {
        display: none;
      }

      .scores {
        width: 100%;
        max-width: 320px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .score-row {
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
        background: var(--surface);
        border-radius: 10px;
        font-size: 20px;
      }
      .score-row.active {
        border-left: 4px solid var(--accent);
      }

      /* Colour picker. Swatch targets are 44px, the smallest thing a thumb hits
       reliably on a phone — the same reason the throw button is as large as it is. */
      .colour-picker {
        width: 100%;
        max-width: 320px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .colour-label {
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .colour-swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .colour-swatch {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        padding: 0;
        border: 3px solid transparent;
        box-shadow: none;
        cursor: pointer;
      }
      /* The ring, not a tick: a checkmark over an arbitrary colour is unreadable on
       roughly half the palette. */
      .colour-swatch.selected {
        border-color: var(--text);
      }

      /* The two ways in, side by side and the same weight, so neither reads as the
       main one. Both are the same 44px circle as a swatch. */
      .colour-modes {
        display: flex;
        gap: 24px;
        justify-content: center;
      }
      /* font: inherit as well as the colour reset — the generic `button` rule above is
       700-weight uppercase, and Default is a peer of the Custom <label>, not a CTA. */
      .colour-mode {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        background: none;
        box-shadow: none;
        padding: 0;
        border: none;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        font-weight: 400;
        text-transform: none;
        cursor: pointer;
      }
      .colour-mode-dot {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid transparent;
        overflow: hidden;
        flex: 0 0 auto;
      }
      /* Same ring as a selected swatch, borrowed for "this sub-menu is open" — one
       visual idiom for "you are here" rather than two. */
      .colour-mode[aria-expanded='true'] .colour-mode-dot {
        border-color: var(--text);
      }
      /* appearance:none and the oversize box because Chromium draws the native colour
       input as an inset rounded rectangle inside its own padding — left alone it shows
       as a square in a round hole no matter what the wrapper clips. */
      .colour-mode-dot--custom input[type='color'] {
        appearance: none;
        -webkit-appearance: none;
        display: block;
        width: 150%;
        height: 150%;
        margin: -25%;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
      }
      .colour-mode-dot--custom input[type='color']::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .colour-mode-dot--custom input[type='color']::-webkit-color-swatch {
        border: none;
      }
      .colour-mode-dot--custom input[type='color']::-moz-color-swatch {
        border: none;
      }

      /* Every player's colour beside their name in the scores, so the dots on the TV
       and the names on the phone agree about who is who. */
      .score-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .score-row .name {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #debug {
        flex: 0 0 auto;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: var(--muted);
        background: rgba(0, 0, 0, 0.35);
        padding: 8px 12px;
        display: none;
        white-space: pre;
        overflow-x: auto;
      }
      #debug.visible {
        display: block;
      }
      #debugToggle {
        position: fixed;
        top: 4px;
        right: 8px;
        font-size: 10px;
        padding: 6px 10px;
        background: transparent;
        color: var(--muted);
        box-shadow: none;
      }

      /* Reopens the tutorial from the lobby or the wait screen. Hidden everywhere else —
       showScreen owns that, keyed off which screen is active — so it is never on top of
       the join form or a live throw. */
      #howToPlayBtn {
        position: fixed;
        top: 4px;
        left: 8px;
        font-size: 13px;
        font-weight: 700;
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        color: var(--muted);
        box-shadow: none;
      }

      /* ---------------- tutorial ---------------- */
      .tutorial-topbar {
        width: 100%;
        max-width: 320px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .tutorial-dots {
        display: flex;
        gap: 6px;
      }
      .tutorial-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #2f3e56;
      }
      .tutorial-dot.active {
        background: var(--accent);
      }
      .tutorial-skip {
        padding: 6px 10px;
        font-size: 12px;
      }
      .tutorial-visual {
        width: 190px;
        height: 142px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }
      .tutorial-visual svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #tutorialScreen h2 {
        font-size: 21px;
      }
      #tutorialScreen p {
        max-width: 280px;
      }
      .tutorial-actions {
        display: flex;
        gap: 10px;
        width: 100%;
        max-width: 300px;
        justify-content: center;
        margin-top: 6px;
      }
      .tutorial-actions button:not(.link) {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="status">Connecting…</div>
    <button id="debugToggle">debug</button>
    <button id="howToPlayBtn" title="How to play" hidden>?</button>

    <!-- Join -->
    <section id="joinScreen" class="screen active">
      <h1>ROCK SKIPPING</h1>
      <div id="joinError" class="error"></div>
      <input id="nameInput" type="text" placeholder="YOUR NAME" maxlength="12" autocomplete="off" />
      <button id="joinBtn">JOIN GAME</button>
      <p>You'll join the game on the TV.</p>
    </section>

    <!-- Choosing a stone -->
    <section id="chooseScreen" class="screen">
      <h2>Choose your stone</h2>
      <p>Point your phone at a stone on the TV, then tap CONFIRM.</p>
      <p id="chooseRock" class="last-throw"></p>
      <button id="confirmBtn">CONFIRM</button>

      <!-- Your colour. The swatches are the host's palette, sent in SPECTATE rather than
         duplicated here so there is one palette in the project, editable on the
         PlayerColourPalette asset. They live behind the Default button rather than on
         the screen: the full palette is eight 44px circles, which wraps to two rows on
         a phone and pushes the advance buttons off the comfortable part of the thumb's
         reach. The native picker is deliberate: it is the OS colour wheel on both
         platforms, needs no library, and this page is served from a local relay with
         nowhere to load one from. -->
      <div id="colourPicker" class="colour-picker" hidden>
        <span class="colour-label">Your colour</span>
        <div class="colour-modes">
          <button
            id="colourDefaultBtn"
            type="button"
            class="colour-mode"
            aria-expanded="false"
            aria-controls="colourSwatches"
          >
            <span id="colourDefaultDot" class="colour-mode-dot"></span>
            <span>Default</span>
          </button>
          <label class="colour-mode">
            <span class="colour-mode-dot colour-mode-dot--custom">
              <input id="colourInput" type="color" value="#ffffff" />
            </span>
            <span>Custom</span>
          </label>
        </div>
        <div id="colourSwatches" class="colour-swatches" hidden></div>
      </div>
      <!-- Advancing the match from a phone, so a couch session never has to go back to
         the host's keyboard. Hidden until a SPECTATE says this phase can be advanced;
         renderAdvance owns the label, because LOBBY on the wire covers both a fresh
         lobby and a mid-match re-pick. -->
      <button id="advanceBtn" class="link" hidden>START MATCH</button>
      <button id="recentreBtn" class="link">RE-CENTRE</button>
    </section>

    <!-- Spectating -->
    <section id="waitScreen" class="screen">
      <h2 id="waitTitle">Waiting for your turn</h2>
      <p id="waitDetail">Watch the TV.</p>
      <p id="lastThrow" class="last-throw"></p>
      <!-- The results-screen half of the same idea. Primary here rather than a .link:
         on final scores it is the only thing left to do. -->
      <button id="againBtn" hidden>PLAY AGAIN</button>
      <div id="scores" class="scores"></div>
      <!-- Renaming reachable without a rejoin — the seat is keyed by device id, not by
         name, so this is a cosmetic SET_NAME rather than a new join. Styled as a .link
         like RE-CENTRE: a secondary action, not something to compete with PLAY AGAIN. -->
      <button id="nameBtn" class="link"></button>
      <input id="nameEditInput" type="text" placeholder="YOUR NAME" maxlength="12" autocomplete="off" hidden />
    </section>

    <!-- Pre-round walkthrough. Auto-shown once per device right after joining, and
       reachable afterward from the "?" button on the lobby/wait screens — see
       openTutorial/closeTutorial in app.js. A live TURN always closes it: your own
       throw takes priority over reading about someone else's. -->
    <section id="tutorialScreen" class="screen">
      <div class="tutorial-topbar">
        <div id="tutorialDots" class="tutorial-dots"></div>
        <button id="tutorialSkipBtn" class="link tutorial-skip">SKIP</button>
      </div>
      <div id="tutorialVisual" class="tutorial-visual"></div>
      <h2 id="tutorialTitle"></h2>
      <p id="tutorialBody"></p>
      <div class="tutorial-actions">
        <button id="tutorialBackBtn" class="link" hidden>BACK</button>
        <button id="tutorialNextBtn">NEXT</button>
      </div>
    </section>

    <!-- Your turn -->
    <section id="throwScreen" class="screen">
      <h2 id="throwTitle">Your turn!</h2>
      <p id="throwHint">Point your phone at the lake, tap, then swing and stop sharply.</p>

      <!-- D3: two-state status badge — text/colour driven by onCalibrationStateChange.
         Deliberately just Settling/Aiming; see the constructor comment on `motion`
         in app.js for why a third "Swinging" state is dropped from this pass. -->
      <span id="calBadge" class="cal-badge">Settling…</span>

      <!-- D2: live tilt indicator, running continuously whenever this screen is up —
         see showScreen's startTiltIndicator/stopTiltIndicator. The lock ring is D2's
         own burst-and-fade pulse at the Settling→Aiming edge, a distinct animation
         from D7's progressive fill-ring around the grip button below. -->
      <div id="tiltBox" class="tilt-box">
        <div class="tilt-crosshair"></div>
        <div id="tiltLockRing" class="tilt-lock-ring"></div>
        <div id="tiltBubble" class="tilt-bubble"></div>
      </div>

      <!-- renderGripButton paints the button's own label on startup; the markup only
         covers the instant before the script runs. It used to say HOLD and stayed
         that way, because onStateChange fires on transitions and the first one is
         the player's own tap.

         D7: #armRing is the visible steady-hold gate — a progressive fill over
         ThrowTuning.armGraceMs, started on the ARMED transition (renderArmRing in
         app.js), separate markup and a separate CSS keyframe from #tiltLockRing's
         pulse-and-fade above. -->
      <div id="gripWrap" class="grip-wrap">
        <svg id="armRing" class="arm-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" />
        </svg>
        <button id="gripBtn">TAP TO AIM</button>
      </div>
      <p id="throwResult"></p>
    </section>

    <pre id="debug"></pre>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
