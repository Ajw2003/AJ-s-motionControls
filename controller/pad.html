<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1b2a" />
    <title>AJ's Motion Controls — Controller</title>
    <style>
      :root {
        --bg: #0d1b2a;
        --surface: #1b263b;
        --accent: #4cc9f0;
        --good: #57cc99;
        --bad: #ef476f;
        --text: #e0e1dd;
        --muted: #7d8597;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        padding: 16px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 12px;
      }
      #start {
        width: 100%;
        padding: 20px;
        font-size: 1.2rem;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--bg);
      }
      #start[hidden] {
        display: none;
      }
      .card {
        background: var(--surface);
        border-radius: 12px;
        padding: 14px;
        margin-top: 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        font-variant-numeric: tabular-nums;
      }
      .label {
        color: var(--muted);
      }
      #status.ok {
        color: var(--good);
      }
      #status.bad {
        color: var(--bad);
      }
      #rate {
        font-size: 2.2rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>AJ's Motion Controls</h1>
    <button id="start" type="button">Start controller</button>

    <div class="card">
      <div class="row">
        <span class="label">Connection</span><span id="status">Not started</span>
      </div>
      <div class="row"><span class="label">Slot</span><span id="slot">–</span></div>
    </div>

    <div class="card">
      <div class="row">
        <span class="label">Sending</span><span><span id="rate">0</span> Hz</span>
      </div>
      <div class="row"><span class="label">Accel (g)</span><span id="accel">–</span></div>
      <div class="row"><span class="label">Gyro (°/s)</span><span id="gyro">–</span></div>
      <div class="row"><span class="label">Sent</span><span id="sent">0</span></div>
    </div>

    <script type="module" src="js/pad.js"></script>
  </body>
</html>
