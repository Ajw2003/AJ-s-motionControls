<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pine (spruce) half-profile, in metres. READ BY build_lake_louise.py.

  id="pine-profile" is the RIGHT half of the tree's silhouette: x = radius, up the page =
  height. The build spins it around the vertical axis with 5 sides, so each segment of this
  line becomes a ring of 5 quads (the apex segment becomes 5 triangles). Three segments -> 25
  triangles a tree, which is what lets ~1000 of them fit the forest budget.

  Narrow on purpose: the Lake Louise forest is spruce and fir, tall and thin, and a wide cone
  reads as a Christmas tree at distance. The notch between the two tiers is what makes it read
  as a conifer rather than a spike. The base sits 1 m below ground (y = 0 here is ground level)
  so trees on a slope never show a floating gap on the downhill side; no base cap is built.

  The mirrored left half (class="guide") is only there so the whole tree can be seen.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="-4 -11 8 12">
  <rect class="guide" x="-4" y="-11" width="8" height="12" fill="#f3f1ea"/>
  <line class="guide" x1="-4" y1="0" x2="4" y2="0" stroke="#8a7a5a" stroke-width="0.05"/>
  <polygon class="guide" fill="#26301f"
           points="0,-10 1.6,-5.4 0.75,-5.6 2.2,1 -2.2,1 -0.75,-5.6 -1.6,-5.4"/>
  <polyline id="pine-profile" fill="none" stroke="#e0a030" stroke-width="0.08"
            points="0,-10 1.6,-5.4 0.75,-5.6 2.2,1"/>
</svg>
