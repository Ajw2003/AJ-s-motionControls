name: Renew play.skiprocking.ca certificate

# Serverless renewal for the certificate CertificateProvider.cs downloads at launch.
# See docs/plans/magic-domain-replacement.md Phase 1 for the full rationale — the short
# version: local-ip.sh (the previous free-wildcard-cert service) is permanently dead, and
# there is no drop-in replacement, so the certificate story moves to a domain we own
# (play.skiprocking.ca) with an unattended renewal job instead of a third party.
#
# DNS-01 rather than HTTP-01 deliberately: play.skiprocking.ca needs no public A record at
# all — nothing on the internet ever answers on that name — so there is no public listener
# to stand up or keep alive. dns_porkbun proves domain ownership entirely via Porkbun's API.
#
# This issues a SINGLE-NAME certificate, not a wildcard. LAN mode (which needed a wildcard
# to cover an arbitrary IP-encoded label) is deprecated in favour of Hotspot-only, where the
# hotspot address is always the fixed 192.168.137.1 — one name is all that is ever needed,
# and a single-name cert keeps the blast radius of the deliberately-published private key
# to that one name rather than every possible subdomain.
#
# STATUS: proven end to end. Two workflow_dispatch runs on 2026-09-03 (run numbers 1 and 2)
# issued against production and published successfully; deploy/verify-published-cert.sh
# passes against the live URL. Earlier revisions of this file carried an "UNTESTED: this step
# has never been run" note on the publish step; it was stale and has been removed.

on:
  schedule:
    # Weekly, Mondays. The freshness gate below is what decides whether a run actually issues,
    # so most weeks this is a cheap no-op that exists to notice a problem early rather than to
    # produce a certificate. A missed week is harmless against a 90-day certificate.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: >-
          Let's Encrypt endpoint. PRODUCTION is the default because this pipeline is
          validated and a production certificate is already published — a scheduled run
          must be able to actually renew. Choose staging to rehearse a change to this file:
          a staging run issues an untrusted certificate and publishes it to the separate
          "staging" tag, exercising every step including publish without touching the live
          asset the game downloads.
        type: choice
        options:
          - production
          - staging
        default: production
      force:
        description: >-
          Issue even if the published certificate is still fresh. Off by default so weekly
          runs do not burn Let's Encrypt's duplicate-certificate rate limit (5 per exact
          name set per 7 days) producing certificates nothing needed.
        type: boolean
        default: false
      verify_only:
        description: >-
          Check the published certificate and stop. Issues nothing, publishes nothing,
          needs no secrets. This is the fastest way to answer "is the live certificate
          currently good?" without touching anything.
        type: boolean
        default: false

# Nothing here reads or writes this repository's contents. Publishing uses a separate,
# repo-scoped PAT (see the publish step), so the default token needs nothing.
permissions:
  contents: read

env:
  # The one hostname this workflow will ever issue for. Single source of truth for this
  # file; Assets/Scripts/Net/MagicDomain.cs is the equivalent source of truth on the Unity
  # side, and deploy/fetch-seed-cert.ps1 has a third copy. The three are expected to agree by
  # hand, not by any shared config — the domain changes rarely enough that this is not worth
  # building machinery for.
  DOMAIN: play.skiprocking.ca

  # Where the finished certificate is published. Must be a PUBLIC repo — see the publish
  # step's comment for why this cannot be the repo this workflow lives in. It holds no source,
  # only the release the game downloads from.
  CERT_REPO: Ajw2003/rockskipping-cert

  # Fixed forever. MagicDomain.cs's download URL embeds this tag, so changing it silently
  # breaks every already-shipped build that cannot be rebuilt to match.
  CERT_TAG: current

  # Where a staging rehearsal publishes instead. Nothing downloads from this tag; it exists so
  # the publish step is reachable outside production. Before this existed, the only way to
  # exercise publish was to issue for real, which is why that step went unproven for so long.
  STAGING_TAG: staging

  # Skip issuing when the published certificate still has at least this long to run. Let's
  # Encrypt issues for ~90 days and CertificateProvider renews client-side within 14 days of
  # expiry, so 30 leaves a wide margin either side: three weekly runs may all skip and the
  # fourth still has a month of headroom.
  RENEW_WHEN_DAYS_BELOW: 30

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (for deploy/verify-published-cert.sh)
        uses: actions/checkout@v4

      - name: Resolve run settings
        id: cfg
        run: |
          set -euo pipefail
          # A scheduled run carries no inputs at all, so every one of these falls back to its
          # default. Production is the fallback deliberately: a cron that quietly issues into
          # staging can never renew anything, and the failure is invisible until the live
          # certificate expires. That was the behaviour before 2026-09-07 and it would have
          # silently stopped renewal.
          MODE="${{ github.event.inputs.environment || 'production' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          VERIFY_ONLY="${{ github.event.inputs.verify_only || 'false' }}"

          if [ "$MODE" = "staging" ]; then
            echo "server=letsencrypt_test" >> "$GITHUB_OUTPUT"
            echo "tag=$STAGING_TAG"        >> "$GITHUB_OUTPUT"
            echo "allow_staging=--allow-staging" >> "$GITHUB_OUTPUT"
          else
            echo "server=letsencrypt" >> "$GITHUB_OUTPUT"
            echo "tag=$CERT_TAG"      >> "$GITHUB_OUTPUT"
            echo "allow_staging="     >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$MODE"               >> "$GITHUB_OUTPUT"
          echo "force=$FORCE"             >> "$GITHUB_OUTPUT"
          echo "verify_only=$VERIFY_ONLY" >> "$GITHUB_OUTPUT"

          {
            echo "### Certificate run settings"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| endpoint | \`$MODE\` |"
            echo "| publish tag | \`$( [ "$MODE" = staging ] && echo "$STAGING_TAG" || echo "$CERT_TAG" )\` |"
            echo "| force issue | \`$FORCE\` |"
            echo "| verify only | \`$VERIFY_ONLY\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs on every path, including verify_only. In a normal renewal this is the "before"
      # picture and is allowed to fail — a certificate that is missing or expired is exactly
      # the case a renewal exists to fix, so it must not stop the run.
      - name: Inspect the currently published certificate
        id: published
        continue-on-error: true
        run: |
          set -euo pipefail
          ./deploy/verify-published-cert.sh \
            --tag "${{ steps.cfg.outputs.tag }}" \
            --domain "$DOMAIN" \
            --repo "$CERT_REPO" \
            ${{ steps.cfg.outputs.allow_staging }} \
            | tee published.txt
          DAYS=$(grep -oE '[0-9]+ days remaining' published.txt | grep -oE '^[0-9]+' || echo 0)
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"

      - name: Verify-only stop
        if: steps.cfg.outputs.verify_only == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.published.outcome }}" != "success" ]; then
            echo "::error::The published certificate did not pass verification. See the step above."
            exit 1
          fi
          echo "Published certificate verified. Nothing was issued or published." \
            >> "$GITHUB_STEP_SUMMARY"

      # The freshness gate the old header comment claimed acme.sh's --days flag provided. It
      # did not — no --days was ever passed, and no acme.sh state persists between runs, so
      # every single run issued a brand-new certificate. Weekly that sits just inside Let's
      # Encrypt's 5-duplicates-per-week limit with no room for a manual run alongside it.
      - name: Decide whether to issue
        id: decide
        run: |
          set -euo pipefail
          DAYS="${{ steps.published.outputs.days || 0 }}"
          if [ "${{ steps.cfg.outputs.verify_only }}" = "true" ]; then
            echo "issue=false" >> "$GITHUB_OUTPUT"; echo "Verify-only run."; exit 0
          fi
          if [ "${{ steps.cfg.outputs.force }}" = "true" ]; then
            echo "issue=true" >> "$GITHUB_OUTPUT"; echo "Forced."; exit 0
          fi
          if [ "${{ steps.cfg.outputs.mode }}" = "staging" ]; then
            # A rehearsal is pointless if it skips the thing being rehearsed.
            echo "issue=true" >> "$GITHUB_OUTPUT"; echo "Staging rehearsal always issues."; exit 0
          fi
          if [ "${{ steps.published.outcome }}" != "success" ]; then
            echo "issue=true" >> "$GITHUB_OUTPUT"
            echo "Published certificate is missing or unusable — issuing."; exit 0
          fi
          if [ "$DAYS" -lt "$RENEW_WHEN_DAYS_BELOW" ]; then
            echo "issue=true" >> "$GITHUB_OUTPUT"
            echo "$DAYS days left, under $RENEW_WHEN_DAYS_BELOW — issuing."; exit 0
          fi
          echo "issue=false" >> "$GITHUB_OUTPUT"
          echo "$DAYS days left, at or over $RENEW_WHEN_DAYS_BELOW — nothing to do."
          echo "Skipped: published certificate still has $DAYS days." >> "$GITHUB_STEP_SUMMARY"

      # Unpinned by necessity rather than by preference: this fetches and runs whatever
      # acme.sh currently publishes, in a job that holds Porkbun API credentials. Pinning to a
      # tag would be better and is worth doing when someone can confirm a good one against the
      # upstream releases page — a guessed tag breaks renewal, which is worse than the risk it
      # would mitigate.
      - name: Install acme.sh
        if: steps.decide.outputs.issue == 'true'
        run: |
          set -euo pipefail
          curl -s https://get.acme.sh | sh -s email=noreply@skiprocking.ca
          echo "$HOME/.acme.sh" >> "$GITHUB_PATH"

      - name: Issue certificate (DNS-01, dns_porkbun)
        if: steps.decide.outputs.issue == 'true'
        env:
          # Porkbun requires API access to be switched on per-domain in its panel before
          # these credentials work at all — a one-time manual step, done outside this repo.
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_API_KEY: ${{ secrets.PORKBUN_SECRET_API_KEY }}
        run: |
          set -euo pipefail
          "$HOME/.acme.sh/acme.sh" --issue \
            --dns dns_porkbun \
            -d "$DOMAIN" \
            --server ${{ steps.cfg.outputs.server }} \
            --keylength ec-256

      # acme.sh's install-cert writes to caller-chosen paths in one shot, which sidesteps
      # having to know its internal per-domain storage layout (~/.acme.sh/<domain>_ecc/...,
      # which differs by key type) — the two files this produces are exactly what
      # CertificateProvider.Inspect() expects: a fullchain PEM and a bare key, named
      # server.pem/server.key.
      - name: Export server.pem / server.key
        if: steps.decide.outputs.issue == 'true'
        run: |
          set -euo pipefail
          mkdir -p out
          "$HOME/.acme.sh/acme.sh" --install-cert \
            -d "$DOMAIN" \
            --ecc \
            --fullchain-file "$PWD/out/server.pem" \
            --key-file "$PWD/out/server.key"

      # Everything that has to be true before this pair is allowed near the public URL. The
      # previous version checked SAN with `|| true`, so it could not fail, and never checked
      # the key against the certificate at all — a mismatched pair passes every check on the
      # Unity side (Inspect() opens the certificate and only stats the key) and then kills the
      # relay at TLS startup, which does not look like a certificate problem to anyone.
      - name: Validate before publishing
        if: steps.decide.outputs.issue == 'true'
        run: |
          set -euo pipefail
          fail=0

          echo "--- subject / issuer"
          openssl x509 -in out/server.pem -noout -subject -issuer

          echo "--- SAN covers $DOMAIN"
          SAN=$(openssl x509 -in out/server.pem -noout -ext subjectAltName | tail -n +2 | tr -d ' ')
          echo "$SAN"
          echo "$SAN" | tr ',' '\n' | grep -qx "DNS:$DOMAIN" \
            || { echo "::error::SAN does not cover $DOMAIN"; fail=1; }

          echo "--- key matches certificate"
          A=$(openssl x509 -in out/server.pem -noout -pubkey)
          B=$(openssl pkey -in out/server.key -pubout)
          [ "$A" = "$B" ] || { echo "::error::server.key does not match server.pem"; fail=1; }

          echo "--- fullchain"
          N=$(grep -c 'BEGIN CERTIFICATE' out/server.pem)
          echo "$N certificate(s)"
          [ "$N" -ge 2 ] || { echo "::error::bare leaf, not a fullchain — phones will fail"; fail=1; }

          echo "--- issuer matches the endpoint that was requested"
          # The check that keeps a staging certificate off the live tag. Stated as "does the
          # certificate match the endpoint we asked for" rather than "is it staging", so a
          # production run that somehow produced a staging certificate also fails here.
          ISSUER=$(openssl x509 -in out/server.pem -noout -issuer)
          if echo "$ISSUER" | grep -qi 'staging\|pretend\|bogus'; then
            if [ "${{ steps.cfg.outputs.mode }}" != "staging" ]; then
              echo "::error::Production run produced a STAGING certificate. Refusing to publish."
              fail=1
            else
              echo "staging certificate, and this is a staging run — will publish to '${{ steps.cfg.outputs.tag }}'"
            fi
          else
            if [ "${{ steps.cfg.outputs.mode }}" = "staging" ]; then
              echo "::error::Staging run produced a TRUSTED certificate. Refusing to publish to the staging tag."
              echo "::error::This means a real certificate was issued against production rate limits unintentionally."
              fail=1
            else
              echo "production certificate — will publish to '${{ steps.cfg.outputs.tag }}'"
            fi
          fi

          exit $fail

      # Publishing target: a release asset on a SEPARATE PUBLIC repo, not Cloudflare R2.
      # R2 was the first choice and was rejected for a concrete reason — enabling R2 requires
      # a payment method on file even to stay inside its free tier, and this project's whole
      # premise is infrastructure with no recurring cost or upkeep. GitHub release assets are
      # free, need no card, and are CDN-backed, which is all this needs.
      #
      # Why a separate repo rather than this one: THIS repo is private, and a release asset on
      # a private repo needs an Authorization header to download. CertificateProvider.cs does a
      # plain unauthenticated UnityWebRequest GET from a player's machine, so the asset has to
      # live somewhere anonymous. A dedicated public repo holding only the certificate keeps
      # the game source private while giving the download a public URL.
      #
      # Deliberately NOT committing server.pem/server.key as repo FILES anywhere, even though
      # the key is meant to be public (see docs/plans/magic-domain-replacement.md's security
      # note) — committing puts them in git history forever, unremovable without a history
      # rewrite, and trips GitHub's push-protection secret scanner on every later push. A
      # release asset is neither a commit nor a tree object, so it sidesteps both: --clobber
      # replaces the file in place, leaving no history to rewrite.
      - name: Publish to the public certificate repo
        if: steps.decide.outputs.issue == 'true'
        env:
          # Fine-grained PAT with Contents: read+write on CERT_REPO ONLY. Scoped to that one
          # repo deliberately: it is the sole credential in this workflow that can write
          # anywhere, and the blast radius of a leak should stop at a repo whose entire
          # contents are already public by design.
          GH_TOKEN: ${{ secrets.CERT_REPO_TOKEN }}
          TAG: ${{ steps.cfg.outputs.tag }}
        run: |
          set -euo pipefail
          # A fixed tag, reused forever. The URL MagicDomain.cs points at must never change,
          # so the release is a stable container that gets new assets rather than a new
          # release per renewal — which would move the URL every 90 days and defeat the point.
          # Check-then-create rather than `create || echo`. The first version swallowed every
          # failure, which hid a real HTTP 422 ("Repository is empty" — a release needs a
          # commit to tag, and a freshly created repo has none) and surfaced it two lines
          # later as a baffling "release not found" from the upload.
          if gh release view "$TAG" --repo "$CERT_REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading into it."
          else
            echo "Release $TAG does not exist yet; creating it."
            gh release create "$TAG" \
              --repo "$CERT_REPO" \
              --title "$( [ "$TAG" = "$CERT_TAG" ] && echo 'Current certificate' || echo 'Staging rehearsal (untrusted)' )" \
              --notes 'Auto-published by renew-cert.yml. The private key here is public by design; see docs/plans/magic-domain-replacement.md.'
          fi
          gh release upload "$TAG" \
            --repo "$CERT_REPO" \
            --clobber \
            out/server.pem out/server.key

      # The step that makes this verifiable rather than merely finished. Everything above
      # tests files on the runner; this downloads from the public URL a player's machine uses,
      # anonymously, and re-checks the lot. A publish that "succeeded" but produced something
      # unusable — wrong asset name, a CDN that has not caught up, half an upload — fails here
      # instead of on a phone.
      - name: Verify what was actually published
        if: steps.decide.outputs.issue == 'true'
        run: |
          set -euo pipefail
          # The upload is not always readable the instant gh returns.
          for attempt in 1 2 3 4 5; do
            if ./deploy/verify-published-cert.sh \
                 --tag "${{ steps.cfg.outputs.tag }}" \
                 --domain "$DOMAIN" \
                 --repo "$CERT_REPO" \
                 ${{ steps.cfg.outputs.allow_staging }} \
                 --min-days 30 | tee verified.txt
            then
              {
                echo ""
                echo "### Published and verified"
                echo ""
                echo '```'
                cat verified.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt failed; the asset may not be readable yet, retrying in 15s"
            sleep 15
          done
          echo "::error::Published, but the published artifact does not verify. See above."
          exit 1

        # Needed repo secrets (create before enabling this job):
        #   PORKBUN_API_KEY, PORKBUN_SECRET_API_KEY  — Porkbun API, per-domain toggle required
        #   CERT_REPO_TOKEN                          — fine-grained PAT, Contents: read+write,
        #                                              scoped to CERT_REPO alone
