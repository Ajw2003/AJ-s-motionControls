# Deploy with:  fly launch --no-deploy   then   fly deploy
# Pick a region near the players — relay latency is added to every input.
app = "rockskipping-relay"
primary_region = "ord"

[build]
  builder = "heroku/builder:24"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[env]
  PORT = "8080"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
